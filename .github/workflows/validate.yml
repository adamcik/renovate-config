name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  renovate-config:
    name: Renovate config
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.30.3@sha256:d3d60a87bab73203327dd664f94f11e83091441ee4964c920662d83023446395
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate presets
        run: >-
          renovate-config-validator
          --strict
          --no-global
          default.json
          application.json
          library.json
          automerge.json
          renovate.json

      - name: Test grouping policy
        env:
          RENOVATE_PACKAGE_DIR: /usr/local/renovate
        run: node tests/grouping.mjs
